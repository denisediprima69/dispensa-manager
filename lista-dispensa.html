<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lo Stipo</title>
<style>
  :root {
    --bg: #F7F7F5;
    --surface: #FFFFFF;
    --border: #E4E4E0;
    --text: #1C1C1A;
    --text-muted: #6B6B66;
    --accent: #2F6F4E;
    --accent-soft: #E8F1EC;
    --danger: #B3413A;
    --danger-soft: #F7E9E7;
    --warning: #B8842F;
    --warning-soft: #F6EEDF;
    --radius: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  header {
    padding: 20px 20px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 5;
  }

  header h1 {
    font-size: 19px;
    margin: 0;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .summary-bar {
    margin-top: 12px;
    display: flex;
    gap: 8px;
  }

  .summary-pill {
    flex: 1;
    background: var(--bg);
    border-radius: 10px;
    padding: 10px 12px;
    text-align: left;
  }

  .summary-pill .num {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.1;
  }

  .summary-pill .label {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .summary-pill.urgent .num { color: var(--danger); }

  /* --- Tabs sort --- */
  .sort-tabs {
    display: flex;
    gap: 6px;
    padding: 14px 20px 0;
  }

  .sort-tab {
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
  }

  .sort-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  main {
    flex: 1;
    padding: 16px 20px 100px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* --- Section (per location) --- */
  .zone-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .zone-header {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .zone-header .zone-icon {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .zone-header h2 {
    font-size: 14px;
    font-weight: 700;
    margin: 0;
    flex: 1;
  }

  .zone-header .zone-count {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }

  /* --- Product row --- */
  .product-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .check-btn {
    width: 26px;
    height: 26px;
    min-width: 26px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    transition: all 0.15s ease;
  }

  .check-btn:hover {
    border-color: var(--accent);
  }

  .check-btn svg {
    width: 14px;
    height: 14px;
    stroke: white;
    stroke-width: 3;
  }

  .product-info {
    flex: 1;
    min-width: 0;
  }

  .product-info .name {
    font-size: 14.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .product-info .meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .status-dot {
    width: 9px;
    height: 9px;
    min-width: 9px;
    border-radius: 50%;
  }
  .status-dot.ok { background: var(--accent); }
  .status-dot.warning { background: var(--warning); }
  .status-dot.urgent { background: var(--danger); }
  .status-dot.expired { background: var(--danger); }

  .badge {
    font-size: 11.5px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .badge.ok { background: var(--accent-soft); color: var(--accent); }
  .badge.warning { background: var(--warning-soft); color: var(--warning); }
  .badge.urgent { background: var(--danger-soft); color: var(--danger); }
  .badge.expired { background: var(--danger); color: white; }

  .empty-zone {
    font-size: 13px;
    color: var(--text-muted);
    padding: 14px;
    text-align: center;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 12px;
  }

  /* --- Global empty state --- */
  .global-empty {
    text-align: center;
    padding: 60px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .global-empty .icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }

  .global-empty h2 {
    font-size: 16px;
    margin: 0;
  }

  .global-empty p {
    font-size: 13px;
    color: var(--text-muted);
    max-width: 260px;
    margin: 0;
    line-height: 1.5;
  }

  /* --- FAB --- */
  .fab {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(calc(-50% + 170px));
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(47,111,78,0.35);
    font-size: 26px;
    font-weight: 400;
    z-index: 10;
  }

  @media (max-width: 480px) {
    .fab { right: 24px; left: auto; transform: none; }
  }

  .product-info { cursor: pointer; }

  /* --- Edit modal --- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(28,28,26,0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .modal-overlay.show { opacity: 1; pointer-events: auto; }

  .modal-sheet {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    padding: 20px;
    transform: translateY(20px);
    transition: transform 0.2s ease;
    max-height: 88vh;
    overflow-y: auto;
  }

  .modal-overlay.show .modal-sheet { transform: translateY(0); }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .modal-header h3 { margin: 0; font-size: 17px; font-weight: 700; }

  .modal-close {
    background: var(--bg);
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 16px;
    color: var(--text-muted);
    cursor: pointer;
  }

  .modal-field { margin-bottom: 14px; }

  .modal-field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }

  .modal-field input,
  .modal-field select {
    width: 100%;
    padding: 12px 13px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 15px;
    color: var(--text);
    font-family: inherit;
  }

  .new-category-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .new-category-row input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 13.5px;
    font-family: inherit;
    color: var(--text);
  }

  .new-category-save-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .modal-row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .modal-btn {
    flex: 1;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .modal-btn-save { background: var(--accent); color: white; }
  .modal-btn-delete { background: var(--danger-soft); color: var(--danger); }

  .consume-qty-row { margin-bottom: 18px; text-align: center; }

  .consume-qty-label {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 0 0 10px;
  }

  .qty-stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }

  .qty-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
  }

  .qty-value {
    font-size: 20px;
    font-weight: 700;
    min-width: 24px;
    text-align: center;
  }

  .consume-question {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    margin: 0 0 14px;
  }

  .consume-actions {
    display: flex;
    gap: 10px;
  }

  .consume-action-btn {
    flex: 1;
    padding: 15px 10px;
    border-radius: 12px;
    border: none;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .consume-saved { background: var(--accent-soft); color: var(--accent); }
  .consume-wasted { background: var(--danger-soft); color: var(--danger); }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: white;
    padding: 12px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 12px;
    white-space: nowrap;
    z-index: 20;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .toast button {
    background: none;
    border: none;
    color: var(--accent-soft);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    padding: 0;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <a href="index.html" style="font-size: 12px; color: var(--text-muted); text-decoration: none; font-weight: 600;">← Home</a>
    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:6px;">
      <h1 style="margin:0;">Lo Stipo</h1>
      <a href="lista-spesa.html" style="font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 700; background: var(--accent-soft); padding: 6px 12px; border-radius: 999px;">🛒 Spesa</a>
    </div>
    <div class="summary-bar">
      <div class="summary-pill">
        <div class="num" id="total-count">0</div>
        <div class="label">Prodotti totali</div>
      </div>
      <div class="summary-pill urgent">
        <div class="num" id="urgent-count">0</div>
        <div class="label">In scadenza (7gg)</div>
      </div>
    </div>
  </header>

  <div class="sort-tabs">
    <div class="sort-tab active" data-mode="zone">Per zona</div>
    <div class="sort-tab" data-mode="expiry">Per scadenza</div>
  </div>

  <main id="main-content"></main>

  <a href="aggiungi-prodotto.html" class="fab" aria-label="Aggiungi prodotto">+</a>
</div>

<div class="modal-overlay" id="consume-modal">
  <div class="modal-sheet">
    <div class="modal-header">
      <h3 id="consume-product-name">Prodotto</h3>
      <button class="modal-close" id="consume-close-btn">✕</button>
    </div>
    <div id="consume-qty-row" class="consume-qty-row" style="display:none;">
      <p class="consume-qty-label">Quante unità?</p>
      <div class="qty-stepper">
        <button class="qty-btn" id="qty-minus">−</button>
        <span class="qty-value" id="qty-value">1</span>
        <button class="qty-btn" id="qty-plus">+</button>
      </div>
    </div>
    <p class="consume-question">Come vuoi segnarlo?</p>
    <div class="consume-actions">
      <button class="consume-action-btn consume-saved" id="mark-consumed-btn">
        ✅ Consumato
      </button>
      <button class="consume-action-btn consume-wasted" id="mark-wasted-btn">
        🗑️ Buttato
      </button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="edit-modal">
  <div class="modal-sheet">
    <div class="modal-header">
      <h3>Modifica prodotto</h3>
      <button class="modal-close" id="modal-close-btn">✕</button>
    </div>
    <div class="modal-field">
      <label for="edit-name">Nome prodotto</label>
      <input type="text" id="edit-name">
    </div>
    <div class="modal-row-2">
      <div class="modal-field">
        <label for="edit-category">Categoria</label>
        <select id="edit-category">
          <option value="latticini">Latticini</option>
          <option value="uova">Uova</option>
          <option value="carne">Carne</option>
          <option value="pesce">Pesce</option>
          <option value="verdura">Verdura</option>
          <option value="frutta">Frutta</option>
          <option value="conserve">Conserve</option>
          <option value="surgelati">Surgelati</option>
          <option value="altro">Altro</option>
          <option value="__new__">+ Nuova categoria...</option>
        </select>
        <div id="edit-new-category-row" class="new-category-row" style="display:none;">
          <input type="text" id="edit-new-category-input" placeholder="Nome categoria">
          <button type="button" id="edit-new-category-save" class="new-category-save-btn">Salva</button>
        </div>
      </div>
      <div class="modal-field">
        <label for="edit-qty">Quantità</label>
        <input type="number" id="edit-qty" min="1">
      </div>
    </div>
    <div class="modal-field">
      <label for="edit-date">Data di scadenza</label>
      <input type="date" id="edit-date">
    </div>
    <div class="modal-field">
      <label for="edit-location">Dove si trova</label>
      <select id="edit-location">
        <option value="frigo">Frigo</option>
        <option value="freezer">Freezer</option>
        <option value="dispensa">Dispensa</option>
        <option value="cantina">Cantina</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-delete" id="modal-delete-btn">Elimina</button>
      <button class="modal-btn modal-btn-save" id="modal-save-btn">Salva modifiche</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <span id="toast-text"></span>
  <button id="undo-btn">Annulla</button>
</div>

<script>
(function () {
  const mainContent = document.getElementById('main-content');
  const totalCountEl = document.getElementById('total-count');
  const urgentCountEl = document.getElementById('urgent-count');
  const sortTabs = document.querySelectorAll('.sort-tab');
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toast-text');
  const undoBtn = document.getElementById('undo-btn');

  const editModal = document.getElementById('edit-modal');
  const modalCloseBtn = document.getElementById('modal-close-btn');
  const modalSaveBtn = document.getElementById('modal-save-btn');
  const modalDeleteBtn = document.getElementById('modal-delete-btn');
  const editName = document.getElementById('edit-name');
  const editCategory = document.getElementById('edit-category');
  const editNewCategoryRow = document.getElementById('edit-new-category-row');
  const editNewCategoryInput = document.getElementById('edit-new-category-input');
  const editNewCategorySave = document.getElementById('edit-new-category-save');
  const editQty = document.getElementById('edit-qty');
  const editDate = document.getElementById('edit-date');
  const editLocation = document.getElementById('edit-location');
  let editingId = null;

  const ZONES = [
    { key: 'frigo', label: 'Frigo', icon: '❄️' },
    { key: 'freezer', label: 'Freezer', icon: '🧊' },
    { key: 'dispensa', label: 'Dispensa', icon: '🥫' },
    { key: 'cantina', label: 'Cantina', icon: '🍷' }
  ];

  let sortMode = 'zone';
  let lastSnapshot = null;
  let undoTimer = null;

  const consumeModal = document.getElementById('consume-modal');
  const consumeProductName = document.getElementById('consume-product-name');
  const consumeCloseBtn = document.getElementById('consume-close-btn');
  const consumeQtyRow = document.getElementById('consume-qty-row');
  const qtyMinus = document.getElementById('qty-minus');
  const qtyPlus = document.getElementById('qty-plus');
  const qtyValue = document.getElementById('qty-value');
  const markConsumedBtn = document.getElementById('mark-consumed-btn');
  const markWastedBtn = document.getElementById('mark-wasted-btn');
  let consumingProduct = null;
  let consumeQty = 1;

  // --- Categorie personalizzate (condivise con aggiungi-prodotto.html) ---
  const CATEGORIES_KEY = 'categorie-personalizzate';
  const DEFAULT_CATEGORIES = ['latticini', 'uova', 'carne', 'pesce', 'verdura', 'frutta', 'conserve', 'surgelati', 'altro'];

  async function loadCustomCategories() {
    try {
      const result = await window.storage.get(CATEGORIES_KEY, false);
      return result ? JSON.parse(result.value) : [];
    } catch (e) {
      return [];
    }
  }

  async function saveCustomCategories(categories) {
    try {
      await window.storage.set(CATEGORIES_KEY, JSON.stringify(categories), false);
    } catch (e) {
      console.error('Errore salvataggio categorie', e);
    }
  }

  async function populateEditCategories() {
    const custom = await loadCustomCategories();
    const newOption = editCategory.querySelector('option[value="__new__"]');
    custom.forEach((cat) => {
      if (editCategory.querySelector(`option[value="${cat}"]`)) return;
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
      editCategory.insertBefore(opt, newOption);
    });
  }

  editCategory.addEventListener('change', () => {
    if (editCategory.value === '__new__') {
      editNewCategoryRow.style.display = 'flex';
      editNewCategoryInput.focus();
    } else {
      editNewCategoryRow.style.display = 'none';
    }
  });

  async function saveEditNewCategory() {
    const name = editNewCategoryInput.value.trim();
    if (!name) {
      editNewCategoryInput.focus();
      return;
    }

    const custom = await loadCustomCategories();
    const exists = custom.some(c => c.toLowerCase() === name.toLowerCase()) ||
      DEFAULT_CATEGORIES.includes(name.toLowerCase());

    if (!exists) {
      custom.push(name.toLowerCase());
      await saveCustomCategories(custom);

      const newOption = editCategory.querySelector('option[value="__new__"]');
      const opt = document.createElement('option');
      opt.value = name.toLowerCase();
      opt.textContent = name.charAt(0).toUpperCase() + name.slice(1);
      editCategory.insertBefore(opt, newOption);
    }

    editCategory.value = name.toLowerCase();
    editNewCategoryRow.style.display = 'none';
    editNewCategoryInput.value = '';
  }

  editNewCategorySave.addEventListener('click', saveEditNewCategory);
  editNewCategoryInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      saveEditNewCategory();
    }
  });

  populateEditCategories();

  async function loadProducts() {
    try {
      const result = await window.storage.get('dispensa-prodotti', false);
      return result ? JSON.parse(result.value) : [];
    } catch (e) {
      return [];
    }
  }

  async function saveProducts(products) {
    try {
      await window.storage.set('dispensa-prodotti', JSON.stringify(products), false);
    } catch (e) {
      console.error('Errore salvataggio', e);
    }
  }

  // --- Log eventi (consumato/buttato) — base per le statistiche in home ---
  const EVENTS_KEY = 'dispensa-eventi';

  async function loadEvents() {
    try {
      const result = await window.storage.get(EVENTS_KEY, false);
      return result ? JSON.parse(result.value) : [];
    } catch (e) {
      return [];
    }
  }

  async function saveEvents(events) {
    try {
      await window.storage.set(EVENTS_KEY, JSON.stringify(events), false);
    } catch (e) {
      console.error('Errore salvataggio eventi', e);
    }
  }

  async function logEvent(type, qty, productName) {
    const events = await loadEvents();
    events.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      type, // 'consumato' | 'buttato'
      qty,
      productName,
      date: new Date().toISOString()
    });
    await saveEvents(events);
  }

  function daysUntil(iso) {
    const target = new Date(iso);
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    return Math.round((target - now) / (1000 * 60 * 60 * 24));
  }

  function badgeInfo(days) {
    if (days < 0) return { cls: 'expired', text: 'Scaduto' };
    if (days === 0) return { cls: 'urgent', text: 'Oggi' };
    if (days === 1) return { cls: 'urgent', text: 'Domani' };
    if (days <= 3) return { cls: 'urgent', text: `${days} giorni` };
    if (days <= 7) return { cls: 'warning', text: `${days} giorni` };
    return { cls: 'ok', text: `${days} giorni` };
  }

  function formatDateIt(iso) {
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function capitalize(s) {
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function productRowHTML(p) {
    const days = daysUntil(p.expiryDate);
    const badge = badgeInfo(days);
    const qtyText = p.quantity > 1 ? ` · ${p.quantity} pezzi` : '';
    return `
      <div class="product-row" data-id="${p.id}">
        <button class="check-btn" aria-label="Segna come consumato o buttato">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
        <div class="product-info" data-id="${p.id}">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="meta">${formatDateIt(p.expiryDate)}${qtyText}</div>
        </div>
        <div class="badge ${badge.cls}"><span class="status-dot ${badge.cls}" style="display:inline-block; margin-right:5px; vertical-align:middle;"></span>${badge.text}</div>
      </div>
    `;
  }

  async function render() {
    const products = await loadProducts();

    totalCountEl.textContent = products.length;
    urgentCountEl.textContent = products.filter(p => daysUntil(p.expiryDate) <= 7).length;

    if (products.length === 0) {
      mainContent.innerHTML = `
        <div class="global-empty">
          <div class="icon">🥗</div>
          <h2>La dispensa è vuota</h2>
          <p>Aggiungi il tuo primo prodotto con il pulsante + qui sotto, così iniziamo a tenerlo d'occhio</p>
        </div>
      `;
      return;
    }

    if (sortMode === 'expiry') {
      const sorted = [...products].sort((a, b) => daysUntil(a.expiryDate) - daysUntil(b.expiryDate));
      mainContent.innerHTML = `
        <div class="zone-section">
          <div class="zone-header">
            <div class="zone-icon">📅</div>
            <h2>Tutti i prodotti</h2>
            <span class="zone-count">${sorted.length}</span>
          </div>
          ${sorted.map(productRowHTML).join('')}
        </div>
      `;
    } else {
      let html = '';
      ZONES.forEach(zone => {
        const items = products
          .filter(p => p.location === zone.key)
          .sort((a, b) => daysUntil(a.expiryDate) - daysUntil(b.expiryDate));

        if (items.length === 0) return;

        html += `
          <div class="zone-section">
            <div class="zone-header">
              <div class="zone-icon">${zone.icon}</div>
              <h2>${zone.label}</h2>
              <span class="zone-count">${items.length}</span>
            </div>
            ${items.map(productRowHTML).join('')}
          </div>
        `;
      });
      mainContent.innerHTML = html || `
        <div class="global-empty">
          <div class="icon">🥗</div>
          <h2>La dispensa è vuota</h2>
          <p>Aggiungi il tuo primo prodotto con il pulsante + qui sotto</p>
        </div>
      `;
    }

    attachCheckHandlers();
  }

  function attachCheckHandlers() {
    document.querySelectorAll('.check-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const row = btn.closest('.product-row');
        const id = row.dataset.id;
        const products = await loadProducts();
        const product = products.find(p => p.id === id);
        if (!product) return;
        openConsumeModal(product);
      });
    });

    document.querySelectorAll('.product-info').forEach(el => {
      el.addEventListener('click', async () => {
        const id = el.dataset.id;
        const products = await loadProducts();
        const product = products.find(p => p.id === id);
        if (!product) return;
        openEditModal(product);
      });
    });
  }

  // --- Modale Consumato / Buttato ---
  function openConsumeModal(product) {
    consumingProduct = product;
    consumeQty = 1;
    consumeProductName.textContent = product.name;
    qtyValue.textContent = consumeQty;

    if (product.quantity > 1) {
      consumeQtyRow.style.display = 'block';
    } else {
      consumeQtyRow.style.display = 'none';
    }
    consumeModal.classList.add('show');
  }

  function closeConsumeModal() {
    consumeModal.classList.remove('show');
    consumingProduct = null;
  }

  qtyMinus.addEventListener('click', () => {
    if (consumeQty > 1) {
      consumeQty--;
      qtyValue.textContent = consumeQty;
    }
  });

  qtyPlus.addEventListener('click', () => {
    if (consumingProduct && consumeQty < consumingProduct.quantity) {
      consumeQty++;
      qtyValue.textContent = consumeQty;
    }
  });

  consumeCloseBtn.addEventListener('click', closeConsumeModal);
  consumeModal.addEventListener('click', (e) => {
    if (e.target === consumeModal) closeConsumeModal();
  });

  async function applyConsumeAction(type) {
    if (!consumingProduct) return;

    // snapshot per l'eventuale annulla
    const productsBefore = await loadProducts();
    const eventsBefore = await loadEvents();
    lastSnapshot = {
      products: JSON.parse(JSON.stringify(productsBefore)),
      events: JSON.parse(JSON.stringify(eventsBefore))
    };

    const products = productsBefore;
    const idx = products.findIndex(p => p.id === consumingProduct.id);
    if (idx === -1) return;

    const remaining = products[idx].quantity - consumeQty;
    if (remaining > 0) {
      products[idx].quantity = remaining;
    } else {
      products.splice(idx, 1);
    }

    await saveProducts(products);
    await logEvent(type, consumeQty, consumingProduct.name);
    closeConsumeModal();

    if (type === 'consumato') {
      showUndoToast(`✅ ${consumingProduct.name} segnato come consumato`);
    } else {
      showUndoToast(`😔 Questa volta non ce l'abbiamo fatta: ${consumingProduct.name} buttato`);
    }
    render();
  }

  markConsumedBtn.addEventListener('click', () => applyConsumeAction('consumato'));
  markWastedBtn.addEventListener('click', () => applyConsumeAction('buttato'));

  // --- Modale Modifica ---
  function openEditModal(product) {
    editingId = product.id;
    editName.value = product.name;
    editCategory.value = product.category || 'altro';
    editQty.value = product.quantity || 1;
    editDate.value = product.expiryDate;
    editLocation.value = product.location;
    editNewCategoryRow.style.display = 'none';
    editModal.classList.add('show');
  }

  function closeEditModal() {
    editModal.classList.remove('show');
    editingId = null;
  }

  modalCloseBtn.addEventListener('click', closeEditModal);
  editModal.addEventListener('click', (e) => {
    if (e.target === editModal) closeEditModal();
  });

  modalSaveBtn.addEventListener('click', async () => {
    if (!editingId) return;
    const name = editName.value.trim();
    const date = editDate.value;
    if (!name || !date) {
      showSimpleToast('Compila nome e data di scadenza');
      return;
    }

    const products = await loadProducts();
    const idx = products.findIndex(p => p.id === editingId);
    if (idx === -1) return;

    products[idx] = {
      ...products[idx],
      name,
      category: editCategory.value,
      quantity: parseInt(editQty.value, 10) || 1,
      expiryDate: date,
      location: editLocation.value
    };
    await saveProducts(products);
    closeEditModal();
    render();
  });

  modalDeleteBtn.addEventListener('click', async () => {
    if (!editingId) return;
    const productsBefore = await loadProducts();
    const idx = productsBefore.findIndex(p => p.id === editingId);
    if (idx === -1) return;

    // Elimina "per correzione": non è un consumo né uno spreco, quindi nessun evento loggato
    lastSnapshot = { products: JSON.parse(JSON.stringify(productsBefore)), events: null };
    const removedName = productsBefore[idx].name;
    productsBefore.splice(idx, 1);
    await saveProducts(productsBefore);
    closeEditModal();
    showUndoToast(`${removedName} eliminato`);
    render();
  });

  function showSimpleToast(msg) {
    clearTimeout(undoTimer);
    toastText.textContent = msg;
    undoBtn.style.display = 'none';
    toast.classList.add('show');
    undoTimer = setTimeout(() => {
      toast.classList.remove('show');
      undoBtn.style.display = 'inline';
    }, 2200);
  }

  function showUndoToast(message) {
    clearTimeout(undoTimer);
    toastText.textContent = message;
    undoBtn.style.display = 'inline';
    toast.classList.add('show');
    undoTimer = setTimeout(() => {
      toast.classList.remove('show');
      lastSnapshot = null;
    }, 4500);
  }

  undoBtn.addEventListener('click', async () => {
    if (!lastSnapshot) return;
    await saveProducts(lastSnapshot.products);
    if (lastSnapshot.events !== null) {
      await saveEvents(lastSnapshot.events);
    }
    lastSnapshot = null;
    clearTimeout(undoTimer);
    toast.classList.remove('show');
    render();
  });

  sortTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      sortTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      sortMode = tab.dataset.mode;
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
