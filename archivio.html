<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lo Stipo — Archivio</title>
<style>
  :root {
    --bg: #FAF3E3;
    --surface: #FFFDF7;
    --border: #E8DCC3;
    --text: #3B3A4A;
    --text-muted: #7B7568;
    --accent: #E37434;
    --accent-ink: #B8541B;
    --accent-soft: #FBE5D4;
    --danger: #A63A40;
    --radius: 22px;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; }

  .app { width: 100%; max-width: 480px; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; }

  header { padding: 20px 20px 16px; position: sticky; top: 0; z-index: 5; }
  header a.back-link { font-size: 12px; text-decoration: none; font-weight: 600; }
  header h1 { margin: 6px 0 0; }
  header p { margin: 4px 0 0; font-size: 13px; }

  main { flex: 1; padding: 20px 20px 48px; display: flex; flex-direction: column; gap: 14px; }

  .month { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--hdr); margin: 10px 0 0; }
  .month:first-child { margin-top: 0; }

  .a-card { background: var(--surface); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow-card); }
  .a-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .a-name { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .a-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.45; }
  .a-badge { white-space: nowrap; font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #F5D9D6; color: #7C2F35; }
  .a-badge.ok { background: #E3ECF5; color: #3F6A94; }
  .a-actions { display: flex; gap: 8px; margin-top: 12px; }
  .a-actions button { white-space: nowrap; appearance: none; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 9px 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .a-actions button img { width: 22px; height: 22px; }
  .btn-restore { flex: 1; white-space: nowrap; background: var(--accent); color: #fff; border: none; }
  .btn-del { background: #fff; color: var(--danger); border: 2px solid #E3B3B0; }
  .btn-del.sure { background: var(--danger); color: #fff; border-color: var(--danger); }

  .empty { text-align: center; padding: 28px 12px 8px; }
  .empty img { width: 120px; height: 120px; }
  .empty h2 { margin: 10px 0 6px; }
  .empty p { margin: 0 auto 18px; max-width: 290px; font-size: 13.5px; color: var(--text-muted); line-height: 1.5; }
  .btn { display: inline-flex; align-items: center; justify-content: center; padding: 14px 26px; background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; text-decoration: none; }

  .note { font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.5; margin-top: 6px; }

  .toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translate(-50%, 30px); opacity: 0; pointer-events: none; z-index: 60; background: #3B3A4A; color: #fff; padding: 12px 20px; border-radius: 999px; font-size: 13.5px; font-weight: 600; box-shadow: 0 10px 24px rgba(59,58,74,.3); transition: opacity .25s ease, transform .25s ease; width: max-content; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
<script src="storage-shim.js?v=7"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=8">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E37434">
</head>
<body class="pg-purple">
<div class="app">
  <header>
    <a href="index.html" class="back-link">← Home</a>
    <h1><img class="ic ic-h1" src="assets/icons/archivio.svg" alt=""> Archivio</h1>
    <p>Lo storico dei prodotti che hai messo da parte</p>
  </header>

  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const ARCHIVE_KEY = 'dispensa-archivio';
  const PRODUCTS_KEY = 'dispensa-prodotti';
  const main = document.getElementById('main');

  async function load(key) {
    try { const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : []; }
    catch (e) { return []; }
  }
  async function save(key, list) {
    try { await window.storage.set(key, JSON.stringify(list), false); } catch (e) { console.error('Errore salvataggio', e); }
  }

  function esc(str) { const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML; }
  function dateIt(iso) { return new Date(iso).toLocaleDateString('it-IT', { day: 'numeric', month: 'short' }); }
  function monthIt(iso) {
    const t = new Date(iso).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  function dayStart(iso) { const d = new Date(iso); d.setHours(0, 0, 0, 0); return d; }
  function daysLabel(n) { return n === 1 ? '1 giorno' : n + ' giorni'; }

  let toastTimer = null;
  function toast(text) {
    const el = document.getElementById('toast');
    el.textContent = text; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
  }

  function card(p) {
    // quanti giorni era scaduto nel momento in cui l'hai archiviato
    const gap = p.expiryDate ? Math.round((dayStart(p.archivedAt) - dayStart(p.expiryDate)) / 864e5) : null;
    const badge = gap == null ? '' : gap > 0 ? `<span class="a-badge">scaduto da ${daysLabel(gap)}</span>` : `<span class="a-badge ok">scadeva ${gap === 0 ? 'quel giorno' : 'dopo'}</span>`;
    const qty = p.quantity > 1 ? ` · ${p.quantity} pezzi` : '';
    return `<div class="a-card" data-id="${esc(p.id)}">
      <div class="a-top">
        <div>
          <div class="a-name">${esc(p.name)}</div>
          <div class="a-meta">${p.expiryDate ? 'Scadeva il ' + dateIt(p.expiryDate) + ' · ' : ''}archiviato il ${dateIt(p.archivedAt)}${qty}</div>
        </div>
        ${badge}
      </div>
      <div class="a-actions">
        <button type="button" class="btn-restore" data-restore="${esc(p.id)}">Rimetti nello Stipo</button>
        <button type="button" class="btn-del" data-del="${esc(p.id)}"><img src="assets/icons/cestino.svg" alt=""><span>Elimina</span></button>
      </div>
    </div>`;
  }

  async function render() {
    const archive = (await load(ARCHIVE_KEY)).sort((a, b) => new Date(b.archivedAt) - new Date(a.archivedAt));
    if (!archive.length) {
      main.innerHTML = `<div class="empty">
        <span class="dusty"><img src="assets/stipino-felice.svg" alt="Lo Stipino"></span>
        <h2>Nessun prodotto archiviato</h2>
        <p>Quando archivi un prodotto scaduto dalla Home, sparisce da lì ma lo ritrovi qui, nello storico.</p>
        <a class="btn" href="index.html">Torna alla Home</a>
      </div>`;
      return;
    }
    let html = '', lastMonth = '';
    archive.forEach(p => {
      const m = monthIt(p.archivedAt);
      if (m !== lastMonth) { html += `<div class="month">${esc(m)}</div>`; lastMonth = m; }
      html += card(p);
    });
    html += `<p class="note">${archive.length} ${archive.length === 1 ? 'prodotto archiviato' : 'prodotti archiviati'}. I prodotti archiviati non compaiono in Home né nell'elenco dello Stipo.</p>`;
    main.innerHTML = html;
  }

  let sureTimer = null;
  main.addEventListener('click', async (e) => {
    const restore = e.target.closest('[data-restore]');
    const del = e.target.closest('[data-del]');
    if (restore) {
      const id = restore.dataset.restore;
      const [archive, products] = await Promise.all([load(ARCHIVE_KEY), load(PRODUCTS_KEY)]);
      const item = archive.find(a => a.id === id);
      if (!item) return;
      const back = Object.assign({}, item); delete back.archivedAt;
      await save(PRODUCTS_KEY, products.concat(back));
      await save(ARCHIVE_KEY, archive.filter(a => a.id !== id));
      toast(`${item.name} è tornato nello Stipo`);
      render();
    } else if (del) {
      // doppio tocco: il primo chiede conferma, il secondo elimina davvero
      if (!del.classList.contains('sure')) {
        document.querySelectorAll('.btn-del.sure').forEach(b => { b.classList.remove('sure'); b.querySelector('span').textContent = 'Elimina'; });
        del.classList.add('sure'); del.querySelector('span').textContent = 'Sicuro?';
        clearTimeout(sureTimer);
        sureTimer = setTimeout(() => { del.classList.remove('sure'); del.querySelector('span').textContent = 'Elimina'; }, 4000);
        return;
      }
      const id = del.dataset.del;
      const archive = await load(ARCHIVE_KEY);
      await save(ARCHIVE_KEY, archive.filter(a => a.id !== id));
      toast('Eliminato dall\'archivio');
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
